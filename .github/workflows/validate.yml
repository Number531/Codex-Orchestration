name: Validate package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Run deterministic package tests
        run: python3 -B -m unittest discover -s plugins/codex-orchestration/test -p 'test_*.py'
      - name: Check standalone catalog
        run: python3 -B plugins/codex-orchestration/test/check_catalog.py
      - name: Check documentation
        run: python3 -B plugins/codex-orchestration/test/check_docs.py
      - name: Check whitespace
        run: git show --format= --check HEAD
